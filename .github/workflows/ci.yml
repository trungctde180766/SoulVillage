name: CI Pipeline - SoulVillage Starter

on:
  push:
    branches: [ "main", "master", "codex/prep-skeleton" ]
  pull_request:
    branches: [ "main", "master", "codex/prep-skeleton" ]

jobs:
  validate-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Vite Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Cloud Run Server and Dockerfile
        run: |
          test -f server.js || (echo "server.js missing" && exit 1)
          test -f Dockerfile || (echo "Dockerfile missing" && exit 1)
          echo "Cloud Run container configuration verified successfully."
